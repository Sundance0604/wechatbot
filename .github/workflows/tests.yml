name: Source checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: wechat_cleaner/frontend/package-lock.json
      - run: python -m pip install -r violet_wechat/requirements.txt -r wechat_message_cleanup/requirements.txt -r requirements-dev.txt
      - run: python -m pip install -e ./wechat_cleaner
      - run: npm ci
        working-directory: wechat_cleaner/frontend
      - run: npm run build:cleaner
        working-directory: wechat_cleaner/frontend
      - run: python tools/privacy_audit.py
      - run: python -m pytest -q -p no:cacheprovider
